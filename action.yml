name: SnapRender Screenshot
description: Capture screenshots or PDFs of web pages in a workflow, for preview deployments, visual checks and archives.
author: SnapRender
branding:
  icon: aperture
  color: purple

inputs:
  api-key:
    description: SnapRender API key. Store it as a repository secret. Free keys at https://app.snap-render.com/auth/signup
    required: true
  urls:
    description: One URL per line (up to 50). Each URL becomes one file.
    required: true
  format:
    description: png, jpeg, webp or pdf.
    required: false
    default: png
  full-page:
    description: Capture the whole scrollable page instead of the viewport.
    required: false
    default: "false"
  device:
    description: "Phone or tablet profile: iphone_14, iphone_15_pro, pixel_7, ipad_pro or macbook_pro. Leave empty for desktop."
    required: false
    default: ""
  width:
    description: Viewport width in pixels (320 to 3840). Ignored when a device is set.
    required: false
    default: "1280"
  height:
    description: Viewport height in pixels (200 to 10000). Ignored when a device is set.
    required: false
    default: "800"
  dark-mode:
    description: Render with prefers-color-scheme dark.
    required: false
    default: "false"
  block-ads:
    description: Block ads and trackers.
    required: false
    default: "true"
  block-cookie-banners:
    description: Remove cookie consent banners.
    required: false
    default: "true"
  delay:
    description: Milliseconds to wait after the page loads, for animations.
    required: false
    default: "0"
  hide-selectors:
    description: Comma-separated CSS selectors to hide before the capture.
    required: false
    default: ""
  quality:
    description: JPEG and WebP quality (1 to 100).
    required: false
    default: ""
  output-dir:
    description: Folder the files are written to.
    required: false
    default: snaprender-screenshots
  signed-urls:
    description: Also create signed image URLs (valid 7 days) that can be shown in pull request comments. Each signed URL renders when it is first opened.
    required: false
    default: "false"
  signed-url-per-commit:
    description: Give each commit its own signed image (adds "#sr-<commit>" to the page URL inside the signed link, which pages never see), so comments on later commits do not show a cached image of an earlier one. Set to false to share one cached image across commits.
    required: false
    default: "true"
  fail-on-error:
    description: Fail the step when any URL could not be captured.
    required: false
    default: "true"

outputs:
  files:
    description: JSON array of the files written, in the order of the URLs.
  count:
    description: Number of files written.
  failed:
    description: Number of URLs that could not be captured.
  results:
    description: JSON array with url, file, bytes, error and signed_url for every URL.
  markdown:
    description: A Markdown block with one image per URL (needs signed-urls true), ready for a pull request comment.

runs:
  using: node24
  main: src/index.mjs
