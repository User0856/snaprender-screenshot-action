name: Test
on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test test/

  live:
    # Runs the action itself against the real API when the repository has a SNAPRENDER_API_KEY secret.
    runs-on: ubuntu-latest
    needs: unit
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - id: shots
        uses: ./
        with:
          api-key: ${{ secrets.SNAPRENDER_API_KEY }}
          urls: |
            https://example.com
          device: iphone_15_pro
        continue-on-error: ${{ secrets.SNAPRENDER_API_KEY == '' }}
      - run: test "${{ steps.shots.outputs.count }}" = "1" || [ -z "${{ secrets.SNAPRENDER_API_KEY }}" ]
